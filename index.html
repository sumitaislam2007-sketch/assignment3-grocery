<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Project</title>

    <!-- google font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">

    <!-- daisyUI cdn -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- font awesome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clifford: '#da373d',
                        'primary-color': '#179800',
                    }
                }
            }
        }
    </script>

    <style>
        .sora-font {
            font-family: "Sora", sans-serif;
        }


        /* add media for small device */
        @media screen and (max-width:576px) {
            nav{
                /* display: none; */
            }
        }

    </style>
</head>

<body class="sora-font">
    <!-- header section -->
    <header class="max-w-[1224px] mx-auto">
        <!-- navbar start -->
        <nav>
            <div class="navbar gap-x-40">
                <div class="navbar-start   ">
                    <div class="dropdown">
                        <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 12h8m-8 6h16" />
                            </svg>
                        </div>
                        <ul tabindex="0"
                            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[1] mt-3 w-52 p-2 shadow">
                            <li><a>Product</a></li>
                            <li><a>Services</a></li>
                            <li><a>Contact Us</a></li>
                        </ul>
                    </div>
                    <img class="" src="c2-assets/logo-header.png" alt="">
                </div>
                <div class="navbar-center hidden lg:flex text-2xl">
                    <ul class="menu menu-horizontal px-1">
                        <li><a>Product</a></li>
                        <li><a>Services</a></li>
                        <li><a>Contact Us</a></li>
                    </ul>
                </div>
                <div class="navbar-end gap-x-5 hidden lg:block  ">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-solid fa-cart-shopping"></i>
                    <a class="btn border border-primary-color">Login</a>
                    <a class="btn bg-primary-color text-white">Register</a>
                </div>
            </div>
        </nav>
        <hr class="lg:hidden border border-x-2 border-primary-color">

        <!-- banner start -->
    </header>

    <!-- main section -->
    <main></main>

    <!-- footer section -->
    <footer></footer>
</body>

</html>
